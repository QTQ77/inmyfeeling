<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>文字胶囊</title>
<style>
  body {
    background: #f4efe6;
    color: #2b2b2b;
    font-family: "Songti SC", "SimSun", serif;
    max-width: 560px;
    margin: 60px auto;
    padding: 0 20px;
    line-height: 1.8;
  }
  h1 { font-size: 48px; letter-spacing: 2px; }
  button {
   background: #2b2b2b;
    color: #e8dfd0;
    border: none;
    border-radius: 999px;
    padding: 10px 18px;
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;
    margin-right: 8px;
  }
  button:hover { background: #4a4a4a; }
  #results{
  font-size:18px;
  min-height:35px;
}
#historyList{
  font-size:16px;
  padding-left:20px;
  color:#5c5044;
}
</style>
</head>
<body>
<h1>文字胶囊</h1>
<button id="button1">抽取胶囊</button>
<p id="results">你抽取到的是…</p>
<button id="saveBtn">保存这颗胶囊</button>
<p id="msg" style="color:#b5653c;font-size: 14px; height:20px;"></p>
<h3>最近的胶囊:</h3>
<ul id="historyList">
<script>
const weather=["阴天","小雨","多云","阵雨","晴天","闷热","潮湿","回南天","微风","暴雨","台风","骤雨","湿冷","干燥","薄雾"];
const mood=["狂喜","痛苦","平静","不甘","克制","苦涩","嫉妒","疏离","麻木","疲惫","明亮","轻快"];
const scenes=["出租屋","公交站","花园","厨房","客厅","机场","楼梯拐角","电梯","旧书店","天台","浴室","天桥底","步行街","稻田","雪地","婚礼"];
const btn =document.getElementById("button1");
const result = document.getElementById("results");

btn.addEventListener("click", () => {
  const w = weather[Math.floor(Math.random() * weather.length)];
  const m = mood[Math.floor(Math.random() * mood.length)];
  const s = scenes[Math.floor(Math.random() * scenes.length)];

  const fullText = w + "·" + m + "·" + s;
  result.textContent = "";

  let index = 0;
  const timer = setInterval(() => {
    result.textContent += fullText[index];
    index++;
    if (index >= fullText.length) {
      clearInterval(timer);
    }
  }, 170);
});
const historyList = document.getElementById("historyList");
const saveBtn = document.getElementById("saveBtn");

function showHistory() {
  let history = JSON.parse(localStorage.getItem("myHistory")) || [];
  historyList.innerHTML = ""; 

  for (let i = 0; i < history.length; i++) {
    const li = document.createElement("li");
    li.textContent = history[i];
    historyList.appendChild(li);
  }
}

showHistory();

const msg=document.getElementById("msg")

saveBtn.addEventListener("click", () => {
  const text = result.textContent; 
  if (text === "" || text === "你抽取到的是…") return; 

  let history = JSON.parse(localStorage.getItem("myHistory")) || [];
  if (history.includes(text)){
    msg.textContent="这颗胶囊已经存过啦！";
setTimeout(()=>{msg.textContent="";},1500);
    return;
}
  history.unshift(text); 

  if (history.length > 10) {
    history.pop(); 
  }

  localStorage.setItem("myHistory", JSON.stringify(history));
  showHistory();
msg.textContent="保存成功！";
setTimeout(()=>{msg.textContent="";},1000);
});

saveBtn.addEventListener("click", () => {
  const text = result.textContent;
  localStorage.setItem("lastCapsule", text);
  saved.textContent = "已保存：" + text;
});
</script>
</body>
</html>
